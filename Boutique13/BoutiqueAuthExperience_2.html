function useMediaQuery(query) {
  const [matches, setMatches] = useState(false);
  useEffect(() => {
    if (typeof window === "undefined" || !window.matchMedia) return;
    const mql = window.matchMedia(query);
    const update = () => setMatches(mql.matches);
    update();
    if (mql.addEventListener) mql.addEventListener("change", update);
    else mql.addListener(update);
    return () => {
      if (mql.removeEventListener) mql.removeEventListener("change", update);
      else mql.removeListener(update);
    };
  }, [query]);
  return matches;
}

/* ------------------------------------------------------------------ */

function MagneticButton({ children, disabled, reduceMotion, ...rest }) {
  const ref = useRef(null);
  const [offset, setOffset] = useState({ x: 0, y: 0 });

  const onMove = useCallback(
    (e) => {
      if (reduceMotion || !ref.current) return;
      const r = ref.current.getBoundingClientRect();
      const cx = r.left + r.width / 2;
      const cy = r.top + r.height / 2;
      const dx = e.clientX - cx;
      const dy = e.clientY - cy;
      const max = 4;
      setOffset({
        x: Math.max(-max, Math.min(max, dx * 0.12)),
        y: Math.max(-max, Math.min(max, dy * 0.3)),
      });
    },
    [reduceMotion]
  );

  const reset = useCallback(() => setOffset({ x: 0, y: 0 }), []);

  return (
    <button
      ref={ref}
      type="submit"
      disabled={disabled}
      onMouseMove={onMove}
      onMouseLeave={reset}
      className="b13-cta"
      style={{ transform: `translate(${offset.x}px, ${offset.y}px)` }}
      {...rest}
    >
      <span>{children}</span>
      <ArrowLeft className="b13-cta-icon" size={16} strokeWidth={1.75} />
    </button>
  );
}

function formatTime(total) {
  const m = Math.floor(total / 60)
    .toString()
    .padStart(2, "0");
  const s = Math.floor(total % 60)
    .toString()
    .padStart(2, "0");
  return `${m}:${s}`;
}

function OtpView({ phone, onBack, onVerified, reduceMotion }) {
  const [digits, setDigits] = useState(["", "", "", "", "", ""]);
  const [status, setStatus] = useState("sent"); // idle | sending | sent | verifying | verified | error | expired
  const [seconds, setSeconds] = useState(119);
  const [errorShake, setErrorShake] = useState(false);
  const [converging, setConverging] = useState(false);
  const inputsRef = useRef([]);

  const maskedPhone = phone && phone.length >= 2 ? `09••••••${phone.slice(-2)}` : "09•••••••••";

  useEffect(() => {
    const t = setInterval(() => {
      setSeconds((s) => {
        if (s <= 1) {
          clearInterval(t);
          setStatus((prev) => (prev === "verifying" || prev === "verified" ? prev : "expired"));
          return 0;
        }
        return s - 1;
      });
    }, 1000);
    return () => clearInterval(t);
  }, []);

  useEffect(() => {
    // Focus the first cell on mount.
    const first = inputsRef.current[0];
    if (first) first.focus();
  }, []);

  /* -- DEMO ONLY --------------------------------------------------
     In production, replace this with:
       POST /api/auth/verify-otp   { phone, code }
     and read the resulting session/token + error/rate-limit state
     from the response. OTP generation and checking must never
     happen in the browser. */
  const verify = useCallback(
    (code) => {
      setStatus("verifying");
      setTimeout(() => {
        if (code.length === 6) {
          setStatus("verified");
          // Signature moment: the six cells converge toward the centre
          // and hand off to the success ring before the parent swaps views.
          setTimeout(() => {
            setConverging(true);
            setTimeout(onVerified, reduceMotion ? 0 : 560);
          }, 150);
        } else {
          setStatus("error");
          setErrorShake(true);
          setTimeout(() => setErrorShake(false), 420);
        }
      }, 700);
    },
    [onVerified, reduceMotion]
  );

  const setDigitAt = (i, val) => {
    setDigits((prev) => {
      const next = [...prev];
      next[i] = val;
      return next;
    });
  };

  const handleChange = (i, e) => {
    const raw = e.target.value.replace(/[^0-9]/g, "");
    if (!raw) {
      setDigitAt(i, "");
      return;
    }
    const char = raw[raw.length - 1];
    setDigitAt(i, char);
    if (i < 5) {
      const nextInput = inputsRef.current[i + 1];
      if (nextInput) nextInput.focus();
    } else {
      const code = digits.map((d, idx) => (idx === i ? char : d)).join("");
      if (code.length === 6) verify(code);
    }
  };

  const handleKeyDown = (i, e) => {
    if (e.key === "Backspace") {
      if (digits[i]) {
        setDigitAt(i, "");
      } else if (i > 0) {
        const prevInput = inputsRef.current[i - 1];
        if (prevInput) prevInput.focus();
        setDigitAt(i - 1, "");
      }
    } else if (e.key === "ArrowRight") {
      const t = inputsRef.current[i + 1];
      if (t) t.focus();
    } else if (e.key === "ArrowLeft") {
      const t = inputsRef.current[i - 1];
      if (t) t.focus();
    }
  };

  const handlePaste = (e) => {
    const text = e.clipboardData.getData("text").replace(/[^0-9]/g, "");
    if (!text) return;
    e.preventDefault();
    const chars = text.slice(0, 6).split("");
    const next = ["", "", "", "", "", ""];
    chars.forEach((c, idx) => (next[idx] = c));
    setDigits(next);
    const lastIdx = Math.min(chars.length, 6) - 1;
    const target = inputsRef.current[lastIdx >= 0 ? lastIdx : 0];
    if (target) target.focus();
    if (chars.length === 6) verify(chars.join(""));
  };

  const resend = () => {
    setStatus("sent");
    setSeconds(119);
    setDigits(["", "", "", "", "", ""]);
    const first = inputsRef.current[0];
    if (first) first.focus();
  };

  return (
    <div className="b13-panel-inner">
      <button type="button" className="b13-back" onClick={onBack} aria-label="بازگشت">
        <ArrowRight size={16} strokeWidth={1.5} />
      </button>

      <div className="b13-panel-head">
        <span className="b13-eyebrow">SECURE ACCESS</span>
        <h1 className="b13-display b13-panel-title">Verify.</h1>
        <p className="b13-fa b13-panel-sub">
          کد تأیید ۶ رقمی برای شماره
          <br />
          <span dir="ltr" className="b13-phone-chip">
            {maskedPhone}
          </span>{" "}
          ارسال شد.
        </p>
      </div>

      <div
        className={"b13-otp-row" + (errorShake ? " b13-otp-row--shake" : "")}
        onPaste={handlePaste}
        role="group"
        aria-label="کد تأیید شش رقمی"
      >
        {digits.map((d, i) => {
          const dist = i - 2.5;
          const convergeStyle = converging
            ? {
                transform: `translateX(${dist * -30}px) scale(0.35)`,
                opacity: 0,
                transitionDelay: `${Math.abs(dist) * 40}ms`,
                transitionDuration: "480ms",
              }
            : undefined;
          return (
            <input
              key={i}
              ref={(el) => (inputsRef.current[i] = el)}
              type="text"
              inputMode="numeric"
              maxLength={1}
              readOnly={converging}
              value={d}
              onChange={(e) => handleChange(i, e)}
              onKeyDown={(e) => handleKeyDown(i, e)}
              style={convergeStyle}
              className={
                "b13-otp-cell" +
                (d ? " b13-otp-cell--filled" : "") +
                (status === "error" ? " b13-otp-cell--error" : "")
              }
              aria-label={`رقم ${i + 1} از ۶`}
            />
          );
        })}
      </div>

      <div className="b13-otp-status" aria-live="polite">
        {status === "verifying" && <span className="b13-fa b13-muted">در حال بررسی کد…</span>}
        {status === "verified" && <span className="b13-fa b13-muted">تأیید شد.</span>}
        {status === "error" && <span className="b13-fa b13-error-text">کد وارد شده صحیح نیست.</span>}
        {status === "expired" ? (
          <button type="button" className="b13-fa b13-resend" onClick={resend}>
            ارسال دوباره کد
          </button>
        ) : (
          status !== "verifying" && (
            <span className="b13-fa b13-muted">
              ارسال مجدد کد تا <span dir="ltr">{formatTime(seconds)}</span>
            </span>
          )
        )}
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/*  Card orchestrator                                                  */
/* ------------------------------------------------------------------ */

function AuthCard() {
  const [mode, setMode] = useState("login"); // login | signup
  const [view, setView] = useState("form"); // form | otp | success
  const [rotation, setRotation] = useState(0);
  const [flipping, setFlipping] = useState(false);
  const [morphing, setMorphing] = useState(false);
  const [tilt, setTilt] = useState({ x: 0, y: 0 });

  const [phone, setPhone] = useState("");
  const [password, setPassword] = useState("");
  const [name, setName] = useState("");
  const [phoneError, setPhoneError] = useState(false);
  const [phoneShake, setPhoneShake] = useState(false);
  const phoneShakeTimer = useRef(null);

  const reduceMotion = useMediaQuery("(prefers-reduced-motion: reduce)");
  const canHover = useMediaQuery("(hover: hover) and (pointer: fine)");

  const cardRef = useRef(null);
  const flipTimers = useRef([]);

  useEffect(() => () => flipTimers.current.forEach(clearTimeout), []);
  useEffect(() => () => clearTimeout(phoneShakeTimer.current), []);

  const switchMode = useCallback(
    (target) => {
      if (flipping || target === mode) return;
      setPhoneError(false);
      setPhoneShake(false);
      if (reduceMotion) {
        setMode(target);
        return;
      }
      setFlipping(true);
      setRotation((r) => r + 360);
      const t1 = setTimeout(() => setMode(target), ROTATE_MS * SWAP_AT);
      const t2 = setTimeout(() => setFlipping(false), ROTATE_MS);
      flipTimers.current.push(t1, t2);
    },
    [flipping, mode, reduceMotion]
  );

  const goToOtp = useCallback(() => {
    setMorphing(true);
    setTimeout(() => {
      setView("otp");
      setMorphing(false);
    }, reduceMotion ? 0 : 380);
  }, [reduceMotion]);

  /* A verification code can only be requested once a phone number has
     been entered — otherwise there is nothing to send the SMS to.
     This guards every path that leads to the OTP screen: the main
     form submit and the "login with code" ghost link alike. */
  const requestOtp = useCallback(() => {
    if (!phone.trim()) {
      setPhoneError(true);
      setPhoneShake(true);
      clearTimeout(phoneShakeTimer.current);
      phoneShakeTimer.current = setTimeout(() => setPhoneShake(false), 420);
      return;
    }
    setPhoneError(false);
    goToOtp();
  }, [phone, goToOtp]);

  const updatePhone = useCallback((value) => {
    setPhone(value);
    setPhoneError((prev) => (prev && value.trim() ? false : prev));
  }, []);

  /* DEMO ONLY: In production, replace this with a real "Sign in with
     Google" flow (e.g. Google Identity Services / OAuth redirect),
     then call goToSuccess() once the provider confirms the session.
     Google auth doesn't need the phone/OTP step, so it goes straight
     to success. */
  const continueWithGoogle = useCallback(() => {
    setMorphing(true);
    setTimeout(() => {
      setView("success");
      setMorphing(false);
    }, reduceMotion ? 0 : 380);
  }, [reduceMotion]);

  const backToForm = useCallback(() => {
    setMorphing(true);
    setTimeout(() => {
      setView("form");
      setMorphing(false);
    }, reduceMotion ? 0 : 380);
  }, [reduceMotion]);

  const goToSuccess = useCallback(() => {
    setView("success");
  }, []);

  const resetAll = useCallback(() => {
    setView("form");
    setMode("login");
    setPhone("");
    setPassword("");
    setName("");
    setPhoneError(false);
    setPhoneShake(false);
  }, []);

  const onLoginSubmit = (e) => {
    e.preventDefault();
    requestOtp();
  };
  const onSignupSubmit = (e) => {
    e.preventDefault();
    requestOtp();
  };

  const onCardMouseMove = (e) => {
    if (!canHover || reduceMotion || flipping || !cardRef.current) return;
    const r = cardRef.current.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width - 0.5;
    const py = (e.clientY - r.top) / r.height - 0.5;
    setTilt({ x: py * -2, y: px * 2 });
  };
  const onCardMouseLeave = () => setTilt({ x: 0, y: 0 });

  const stage = view === "otp" ? "otp" : view === "success" ? "success" : mode;
  const markLines = view === "otp" ? ["0", "13"] : view === "success" ? ["13"] : COPY[mode].mark;

  return (
    <div className="b13-scene">
      <AmbientBackground sweeping={flipping} />
      <Mark13 lines={markLines} active={flipping} />

      <div
        className="b13-card-perspective"
        onMouseMove={onCardMouseMove}
        onMouseLeave={onCardMouseLeave}
      >
        <div
          ref={cardRef}
          className={"b13-card" + (flipping ? " b13-card--flipping" : "")}
          style={{
            transform: `rotateY(${rotation}deg) rotateX(${tilt.x}deg) rotateY(${tilt.y}deg)`,
          }}
        >
          <div className={"b13-card-surface" + (morphing ? " b13-card-surface--morph" : "")}>
            <div className="b13-grid">
              <VisualPanel stage={stage} tone={mode === "login" ? "a" : "b"} />

              <div className="b13-form-panel">
                {view === "form" && mode === "login" && (
                  <LoginView
                    phone={phone}
                    setPhone={updatePhone}
                    password={password}
                    setPassword={setPassword}
                    onSubmit={onLoginSubmit}
                    onOtpRequest={requestOtp}
                    onSwitch={() => switchMode("signup")}
                    onGoogleAuth={continueWithGoogle}
                    phoneError={phoneError}
                    phoneShake={phoneShake}
                    reduceMotion={reduceMotion}
                  />
                )}
                {view === "form" && mode === "signup" && (
                  <SignupView
                    name={name}
                    setName={setName}
                    phone={phone}
                    setPhone={updatePhone}
                    password={password}
                    setPassword={setPassword}
                    onSubmit={onSignupSubmit}
                    onSwitch={() => switchMode("login")}
                    onGoogleAuth={continueWithGoogle}
                    phoneError={phoneError}
                    phoneShake={phoneShake}
                    reduceMotion={reduceMotion}
                  />
                )}
                {view === "otp" && (
                  <OtpView phone={phone} onBack={backToForm} onVerified={goToSuccess} reduceMotion={reduceMotion} />
                )}
                {view === "success" && <SuccessView onEnter={resetAll} reduceMotion={reduceMotion} />}
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}
